services:
  postgres:
    image: postgres:16
    container_name: seslikitap-e2e-postgres
    environment:
      POSTGRES_DB: seslikitap_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seslikitap_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seslikitap-e2e-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seslikitap-e2e-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 36000000"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: elestio/minio:latest
    container_name: seslikitap-e2e-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SesliKitap.API/Dockerfile
    container_name: seslikitap-e2e-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: seslikitap_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: seslikitap
      REDIS_CONNECTION_STRING: redis:6379,abortConnect=false
      ADMIN_API_KEY: ${ADMIN_API_KEY:-e2e-test-admin-api-key-minimum-32-chars-long-12345}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:-e2e-test-media-token-secret-minimum-32-chars-12345}
      TTS_API_TOKEN: ${TTS_API_TOKEN:-e2e-test-tts-api-token-minimum-32-chars-long-12345}
      TTS_ENGINE_ORDER: "mock"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  python-worker:
    build:
      context: ./src/SesliKitap.PythonWorker
      dockerfile: Dockerfile
    container_name: seslikitap-e2e-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: seslikitap
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://api:8080
      ADMIN_API_KEY: ${ADMIN_API_KEY:-e2e-test-admin-api-key-minimum-32-chars-long-12345}
      TTS_API_TOKEN: ${TTS_API_TOKEN:-e2e-test-tts-api-token-minimum-32-chars-long-12345}
      TTS_ENGINE_ORDER: "mock"
      ALLOW_MOCK_TTS: "true"
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./src/SesliKitap.Frontend
      dockerfile: Dockerfile
    container_name: seslikitap-e2e-frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: seslikitap-e2e-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
