[project]
name = "seslikitap-worker"
version = "0.2.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM105", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=pipeline --cov=consumers --cov=services --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
